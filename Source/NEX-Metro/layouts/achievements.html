<section class="page" id="achievements-page" x-data x-init="$store.actions.setFocusContext('achievements'); $store.actions.loadAchievementsData()">
    <style>
        
        #achievements-page {
            background: rgba(0, 0, 0, 0.65) !important; 
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        
        .ach-split-layout {
            width: 85vw;
            max-width: 1100px;
            height: 75vh;
            max-height: 750px;
            display: flex;
            background: #383e42; 
            font-family: "Segoe UI", "Source Sans 3", sans-serif;
            border-radius: 8px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        
        .ach-left-pane {
            width: 35%;
            min-width: 320px;
            background: #e4e6e8;
            height: 100%;
            overflow-y: auto;
            border-right: 2px solid #222;
            z-index: 10;
            transition: filter 0.3s ease;
        }

        
        .ach-left-pane.inactive {
            filter: brightness(0.5);
            pointer-events: none;
        }

        .ach-list-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #ccc;
            gap: 15px;
            cursor: pointer;
        }

        
        .ach-list-item.focused {
            background: #6bd316; 
            color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .ach-list-img {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid rgba(0,0,0,0.2);
            background: #222;
        }

        .ach-list-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .ach-list-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3338;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ach-list-item.focused .ach-list-title { color: #fff; }

        .ach-list-id {
            font-size: 0.75rem;
            color: #777;
            font-weight: bold;
            margin-top: 3px;
        }
        .ach-list-item.focused .ach-list-id { color: rgba(255,255,255,0.8); }

        
        .ach-right-pane {
            flex: 1;
            height: 100%;
            position: relative;
        }

        .ach-right-content {
            display: flex;
            flex-direction: column; 
            height: 100%;
            animation: fadeIn 0.3s ease;
        }

        .ach-right-header {
            flex-shrink: 0; 
            padding: 30px 40px 15px 40px;
            display: flex;
            flex-direction: column;
        }

        .ach-right-header h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 300;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .ach-score {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        
        .ach-right-grid {
            flex: 1; 
            display: grid;
            grid-template-columns: repeat(8, 1fr); 
            gap: 10px;
            align-content: start;
            overflow-y: auto; 
            padding: 10px 40px 20px 40px;
        }

        .ach-grid-slot {
            aspect-ratio: 1/1;
            background: #252525;
            border-radius: 4px;
            border: 3px solid transparent; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .ach-grid-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }

        .ach-grid-slot .locked-overlay {
            position: absolute;
            font-size: 16px;
            color: #ffd700;
            opacity: 0.8;
            text-shadow: 0 2px 4px #000;
        }

        
        .ach-grid-slot.focused {
            border-color: #ffd700; 
            transform: scale(1.15); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 5;
            background: #ffd700;
        }

        
        .ach-interactive-details {
            flex-shrink: 0; 
            background: #202427; 
            border-top: 1px solid #444;
            padding: 20px 40px;
            min-height: 140px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ach-detail-title {
            color: #fff;
            font-size: 1.4rem;
            margin: 0;
            font-weight: 600;
        }

        .ach-detail-score {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .ach-detail-desc {
            color: #aaa;
            font-size: 1rem;
            margin: 8px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ach-detail-status {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .ach-detail-status.unlocked { color: #6bd316; }
        .ach-detail-status.locked { color: #888; }

        
        .hide-scroll::-webkit-scrollbar { width: 6px; }
        .hide-scroll::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        
        #achievements-page .nxe-footer-left {
            background: rgba(255, 255, 255, 0.95) !important;
            position: fixed;
            bottom: 30px;
            left: 50% !important;
            right: auto !important; 
            transform: translateX(-50%) !important;
            width: auto; 
            height: 60px;
            padding: 0 45px;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            z-index: 5000;
        }

        #achievements-page .footer-button {
            display: flex; align-items: center; gap: 10px;
            color: #111 !important;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 0 15px;
            cursor: pointer;
        }

        #achievements-page .button-icon {
            border: 2px solid #222 !important;
            color: #222 !important;
            background: transparent !important;
            font-weight: 900;
            width: 26px; height: 26px;
            line-height: 24px;
            font-size: 12px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        
        html[dir="rtl"] .ach-split-layout { flex-direction: row-reverse; }
        html[dir="rtl"] .ach-left-pane { border-right: none; border-left: 2px solid #222; }
    </style>

    <div class="ach-split-layout">
        
        <div class="ach-left-pane hide-scroll" :class="{'inactive': $store.app.isAchievementOverlayOpen}">
            <template x-for="(game, index) in $store.app.achievementsGamesList" :key="game.titleID">
                <div class="ach-list-item"
                     :id="'ach-card-' + index"
                     :class="{'focused': $store.app.focusedIndex === index && !$store.app.isAchievementOverlayOpen}">
                    
                    <img :src="($store.app.filteredLibraryGames.find(g => g.titleID === game.titleID)?.iconUrl) || game.coverUrl || 'assets/icons/placeholder.png'" class="ach-list-img">
                    
                    <div class="ach-list-info">
                        <div class="ach-list-title" x-text="game.name"></div>
                        <div class="ach-list-id" x-text="'TITLE ID: ' + game.titleID"></div>
                    </div>
                </div>
            </template>
        </div>

        <div class="ach-right-pane">

            <template x-if="!$store.app.isAchievementOverlayOpen && $store.app.achievementsGamesList[$store.app.focusedIndex]">
                <div class="ach-right-content">
                    <div class="ach-right-header">
                        <h1 x-text="$store.app.t('dashboard_menu.achievements') || 'Achievements'"></h1>
                        <div class="ach-score">
                            G <span x-text="$store.app.achievementsGamesList[$store.app.focusedIndex].earnedScore || 0"></span>
                        </div>
                    </div>
                    <div class="ach-right-grid hide-scroll">
                        <template x-for="ach in ($store.app.achievementsGamesList[$store.app.focusedIndex].realAchievements || [])" :key="ach.id">
                            <div class="ach-grid-slot">
                                <img :src="ach.full_image" x-show="ach.full_image" :style="!ach.unlocked ? 'filter: grayscale(1) opacity(0.3);' : ''">
                                <div class="locked-overlay" x-show="!ach.unlocked">🔒</div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="$store.app.isAchievementOverlayOpen && $store.app.selectedAchievementGame">
                <div class="ach-right-content">
                    <div class="ach-right-header">
                        <h1 x-text="$store.app.t('dashboard_menu.achievements') || 'Achievements'"></h1>
                        <div class="ach-score">
                            G <span x-text="$store.app.selectedAchievementGame.earnedScore || 0"></span>
                        </div>
                    </div>

                    <div class="ach-right-grid hide-scroll">
                        <template x-for="(ach, idx) in ($store.app.selectedAchievementGame.realAchievements || [])" :key="ach.id">
                            <div :id="'ach-slot-' + idx"
                                 class="ach-grid-slot"
                                 :class="{'focused': $store.app.focusedAchievementIndex === idx}">
                                <img :src="ach.full_image" x-show="ach.full_image" :style="!ach.unlocked ? 'filter: grayscale(1) opacity(0.3);' : ''">
                                <div class="locked-overlay" x-show="!ach.unlocked">🔒</div>
                            </div>
                        </template>
                    </div>

                    <div class="ach-interactive-details">
                        <template x-if="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex]">
                            <div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <h2 class="ach-detail-title" x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].name"></h2>
                                    <div class="ach-detail-score">G <span x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].score"></span></div>
                                </div>
                                <p class="ach-detail-desc" x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].description"></p>
                                <div class="ach-detail-status" 
                                     :class="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].unlocked ? 'unlocked' : 'locked'" 
                                     x-text="$store.app.selectedAchievementGame.realAchievements[$store.app.focusedAchievementIndex].unlocked ? 'Unlocked' : 'Locked'">
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template x-if="!$store.app.achievementsGamesList || $store.app.achievementsGamesList.length === 0">
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #fff; font-size: 20px;">
                    <p x-text="$store.app.t('achievements.NoAchievements') || 'No Achievement History Found'"></p>
                </div>
            </template>

        </div>
    </div>
    
    <footer class="nxe-footer-left">
        <div class="footer-button" @click="$store.actions.goBack()">
            <span class="button-icon b">B</span> 
            <span x-text="$store.app.t('generic.back') || 'Back'"></span>
        </div>

        <div class="footer-button" @click="$store.actions.openAchievementOverlay()">
            <span class="button-icon a">A</span> 
            <span x-text="$store.app.t('generic.details') || 'Details'"></span>
        </div>

        <div class="footer-button" @click="$store.actions.refreshCurrentGame()">
            <span class="button-icon y">Y</span> 
            <span x-text="$store.app.t('generic.refresh') || 'Refresh'"></span>
        </div>
    </footer>
</section>
